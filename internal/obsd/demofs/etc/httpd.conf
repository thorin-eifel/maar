# httpd.conf – nordlicht

server "nordlicht.ctw.lan" {
	listen on * port 80
	location "/.well-known/acme-challenge/*" {
		root "/acme"
		request strip 2
	}
	location * {
		block return 302 "https://$HTTP_HOST$REQUEST_URI"
	}
}

server "nordlicht.ctw.lan" {
	listen on * tls port 443
	tls {
		certificate "/etc/ssl/nordlicht.ctw.lan.fullchain.pem"
		key "/etc/ssl/private/nordlicht.ctw.lan.key"
	}
	root "/htdocs/nordlicht"
}
