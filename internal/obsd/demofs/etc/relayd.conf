# relayd.conf – Lastverteilung für die VMs
interval 5
timeout 1000
log connection

table <web> { 10.0.0.11 retry 2, 10.0.0.12 }

http protocol "httpfwd" {
	match header set "X-Forwarded-For" value "$REMOTE_ADDR"
	pass
}

# Webseite auf beide VMs verteilen
relay "www" {
	listen on 192.168.50.10 port 80
	protocol "httpfwd"
	forward to <web> port 80 mode roundrobin check http "/" code 200
}

redirect "ssh" {
	listen on 192.168.50.10 port 2222
	forward to <web> port 22 check tcp
}
