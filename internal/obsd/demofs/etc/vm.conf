# vm.conf – virtuelle Maschinen auf nordlicht
# Switches zuerst, VMs danach.

switch "intern" {
	interface veb0
	group "intern_vm"
	locked lladdr
}

vm "web01" {
	memory 1G
	enable
	disk "/var/vmd/web01.qcow2"
	interface { switch "intern" lladdr fe:e1:ba:d0:12:01 }
}

vm "db01" {
	memory 2G
	cpus 4
	enable
	disk "/var/vmd/db01.qcow2"
	interface { switch "intern" lladdr fe:e1:ba:d0:12:02 }
}

vm "build" {
	memory 4G
	disable
	disk "/var/vmd/build.qcow2"
	cdrom "/var/vmd/iso/install80.iso"
	boot device cdrom
	local interface
	owner thorin:staff
}
