#	$OpenBSD: pf.conf,v 1.55 2017/12/03 20:40:04 sthen Exp $
#
# nordlicht – Paketfilter

set skip on lo
set block-policy return

table <bruteforce> persist
table <lan> const { 10.0.0.0/24, 192.168.50.0/24 }

match in all scrub (no-df random-id max-mss 1440)
match out on egress inet from vport0:network nat-to (egress)

block log all
block quick from <bruteforce>

pass out

pass in on egress proto tcp to (egress) port ssh \
	keep state (max-src-conn 10, max-src-conn-rate 5/30, \
	overload <bruteforce> flush global)
pass in on egress proto tcp from <lan> to (egress) port 9443
pass in on egress proto tcp to (egress) port { http https }

# VMs am internen Switch
pass in on vport0 from vport0:network
pass in on vport0 inet proto udp from port bootpc to port bootps

# VM-Netze von maar: NAT, Portgruppen und Regeln je VM
anchor "maar"
load anchor "maar" from "/etc/pf.maar.conf"
